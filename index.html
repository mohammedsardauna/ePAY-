<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="ePAY — Universal digital payment platform for supported fiat and cryptocurrency assets."
  >

  <meta
    name="theme-color"
    content="#0b1020"
  >

  <title>ePAY — Universal Payments</title>

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <!-- =========================
       APP LOADING SCREEN
  ========================== -->

  <div id="appLoader" class="app-loader">
    <div class="loader-logo">e<span>PAY</span></div>
    <div class="loader-spinner"></div>
    <p>Loading secure payment workspace...</p>
  </div>


  <!-- =========================
       MOBILE OVERLAY
  ========================== -->

  <div
    id="sidebarOverlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =========================
       APPLICATION SHELL
  ========================== -->

  <div id="app" class="app-shell">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Main navigation"
    >

      <div class="sidebar-header">

        <a
          href="#dashboard"
          class="brand"
          data-page="dashboard"
        >
          e<span>PAY</span>
        </a>

        <button
          id="closeSidebar"
          class="icon-button mobile-only"
          type="button"
          aria-label="Close navigation"
        >
          ×
        </button>

      </div>


      <!-- USER MINI PROFILE -->

      <div class="sidebar-profile">

        <div class="avatar" id="sidebarAvatar">
          EP
        </div>

        <div class="profile-info">

          <strong id="sidebarName">
            ePAY User
          </strong>

          <span id="sidebarRole">
            Personal Account
          </span>

        </div>

      </div>


      <!-- MAIN NAVIGATION -->

      <nav class="navigation">

        <p class="nav-label">
          MAIN
        </p>

        <a
          href="#dashboard"
          class="nav-link active"
          data-page="dashboard"
        >
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </a>

        <a
          href="#wallet"
          class="nav-link"
          data-page="wallet"
        >
          <span class="nav-icon">◈</span>
          <span>Wallet</span>
        </a>

        <a
          href="#send"
          class="nav-link"
          data-page="send"
        >
          <span class="nav-icon">↑</span>
          <span>Send Money</span>
        </a>

        <a
          href="#receive"
          class="nav-link"
          data-page="receive"
        >
          <span class="nav-icon">↓</span>
          <span>Receive</span>
        </a>

        <a
          href="#request"
          class="nav-link"
          data-page="request"
        >
          <span class="nav-icon">＋</span>
          <span>Request Money</span>
        </a>

        <a
          href="#transactions"
          class="nav-link"
          data-page="transactions"
        >
          <span class="nav-icon">↔</span>
          <span>Transactions</span>
        </a>


        <p class="nav-label">
          BUSINESS
        </p>

        <a
          href="#payment-links"
          class="nav-link"
          data-page="payment-links"
        >
          <span class="nav-icon">🔗</span>
          <span>Payment Links</span>
        </a>

        <a
          href="#invoices"
          class="nav-link"
          data-page="invoices"
        >
          <span class="nav-icon">▤</span>
          <span>Invoices</span>
        </a>

        <a
          href="#merchant"
          class="nav-link"
          data-page="merchant"
        >
          <span class="nav-icon">▣</span>
          <span>Merchant</span>
        </a>


        <p class="nav-label">
